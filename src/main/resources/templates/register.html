
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h2>Register</h2>
        <form th:action="@{/register}" method="post" th:object="${user}" class="form-group">
            <input type="text" th:field="*{username}" placeholder="Username" required />
            <input type="email" th:field="*{email}" placeholder="Email" required />
            <input type="password" th:field="*{password}" placeholder="Password" required />
            <!-- Note: Manual confirm password check is not strictly enforced in backend for this simple refactor -->
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p style="margin-top: 15px;">
            Already have an account? <a th:href="@{/login}">Log In</a>
        </p>
    </div>
</body>

</html>
